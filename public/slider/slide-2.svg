  <text x="275" y="182" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="14" font-weight="bold">المبيعات اليومية: 185,000 ر.ي</text>
  <rect x="210" y="194" width="130" height="28" rx="6" fill="#C9A86A"/>
  <text x="275" y="213" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">فاتورة جديدة +</text>
  <rect x="140" y="232" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#231911" stroke-opacity="0.2"/>
  <text x="205" y="251" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">العملاء والتقارير</text>
  <rect x="280" y="232" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#231911" stroke-opacity="0.2"/>
  <text x="345" y="251" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">إدارة المخزون</text>
