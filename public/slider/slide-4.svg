<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <rect x="20" y="20" width="760" height="460" rx="24" fill="#FFFFFF" stroke="#C9A86A" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Gold AB Monogram & Balance Scale Emblem -->
  <g transform="translate(400, 175)">
    <!-- Outer Gold Ring -->
    <circle cx="0" cy="0" r="105" fill="#F9F6F0" stroke="#C9A86A" stroke-width="5"/>
    <!-- Stylized A and B in Gold -->
    <path d="M -55 52 L -15 -55 L 15 -55 L 55 52 L 35 52 L 24 22 L -24 22 L -35 52 Z M -17 4 L 17 4 L 0 -38 Z" fill="#C9A86A"/>
    <!-- Balance Scale in Center -->
    <line x1="0" y1="-35" x2="0" y2="48" stroke="#9A7432" stroke-width="6" stroke-linecap="round"/>
    <line x1="-38" y1="-12" x2="38" y2="-12" stroke="#9A7432" stroke-width="4" stroke-linecap="round"/>
    <path d="M -48 16 Q -38 30 -28 16 Z" fill="#9A7432"/>
    <path d="M 28 16 Q 38 30 48 16 Z" fill="#9A7432"/>
    <line x1="-38" y1="-12" x2="-38" y2="16" stroke="#9A7432" stroke-width="2"/>
    <line x1="38" y1="-12" x2="38" y2="16" stroke="#9A7432" stroke-width="2"/>
  </g>
  <text x="400" y="320" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="34" font-weight="800" letter-spacing="4">ALBAHRI · البحري</text>
  <text x="400" y="356" text-anchor="middle" fill="#9A7432" font-family="Cairo, sans-serif" font-size="20" font-weight="bold">المطور: المهندس والمحاسب بلال البحري — متجر برو POS</text>
</svg>
