  <polygon points="235,335 315,335 335,388 215,388" fill="#E5E7EB"/>
  <rect x="185" y="384" width="180" height="12" rx="4" fill="#D1D5DB" stroke="#C9A86A" stroke-width="1"/>
  <rect x="105" y="105" width="340" height="238" rx="14" fill="#FFFFFF" stroke="#231911" stroke-width="3"/>
  <rect x="120" y="120" width="310" height="208" rx="8" fill="#F9F6F0"/>
  <rect x="120" y="120" width="310" height="36" rx="6" fill="#231911"/>
