      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="50%" stop-color="#EFE8DC"/>
      <stop offset="100%" stop-color="#E5DAC8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Store Wall Sign -->
  <rect x="200" y="24" width="400" height="72" rx="10" fill="#FFFFFF" stroke="#C9A86A" stroke-width="3"/>
  <text x="400" y="68" text-anchor="middle" fill="#9A7432" font-family="Cairo, sans-serif" font-size="30" font-weight="bold">Matjar Pro · متجر برو</text>
