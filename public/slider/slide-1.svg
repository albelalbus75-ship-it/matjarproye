<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E0A"/>
      <stop offset="50%" stop-color="#231911"/>
      <stop offset="100%" stop-color="#0D0906"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#E5C88E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Store Ambient Background Lights -->
  <circle cx="150" cy="90" r="80" fill="#C9A86A" opacity="0.08"/>
  <circle cx="650" cy="110" r="110" fill="#C9A86A" opacity="0.07"/>
  <text x="400" y="42" text-anchor="middle" fill="#E5C88E" font-family="Cairo, Tajawal, sans-serif" font-size="18" font-weight="bold">حلول نقاط البيع الاحترافية • سهولة • سرعة • موثوقية</text>
  <!-- Countertop -->
  <rect x="0" y="360" width="800" height="140" fill="#111317"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#C9A86A" stroke-width="2" opacity="0.4"/>
  <!-- POS Monitor Stand -->
  <polygon points="240,340 320,340 340,395 220,395" fill="#1F242D"/>
  <rect x="190" y="390" width="180" height="14" rx="4" fill="#2A303C" stroke="#C9A86A" stroke-width="1" stroke-opacity="0.4"/>
  <!-- POS Monitor Screen (Dark Mode Matjar Pro) -->
  <rect x="110" y="95" width="350" height="250" rx="14" fill="#0F1319" stroke="#C9A86A" stroke-width="3"/>
  <rect x="124" y="109" width="322" height="222" rx="8" fill="#171C24"/>
  <!-- Screen Header -->
  <rect x="124" y="109" width="322" height="36" rx="6" fill="#231911"/>
  <text x="285" y="132" text-anchor="middle" fill="#C9A86A" font-family="Cairo, sans-serif" font-size="15" font-weight="bold">نقاط البيع - متجر برو Matjar Pro</text>
  <!-- Screen Items -->
  <rect x="138" y="156" width="294" height="28" rx="5" fill="#1E2530"/>
  <text x="420" y="175" text-anchor="end" fill="#F9F6F0" font-family="Cairo, sans-serif" font-size="12">قهوة عربية فاخرة (عبوة)</text>
  <text x="150" y="175" fill="#C9A86A" font-family="monospace" font-size="12" font-weight="bold">6,200 ر.ي</text>
  <rect x="138" y="190" width="294" height="28" rx="5" fill="#1E2530"/>
  <text x="420" y="209" text-anchor="end" fill="#F9F6F0" font-family="Cairo, sans-serif" font-size="12">بخور عود ملكي فاخر</text>
  <text x="150" y="209" fill="#C9A86A" font-family="monospace" font-size="12" font-weight="bold">12,000 ر.ي</text>
  <rect x="138" y="224" width="294" height="28" rx="5" fill="#1E2530"/>
  <text x="420" y="243" text-anchor="end" fill="#F9F6F0" font-family="Cairo, sans-serif" font-size="12">عسل سدر يمني (عبوة)</text>
  <text x="150" y="243" fill="#C9A86A" font-family="monospace" font-size="12" font-weight="bold">18,500 ر.ي</text>
  <!-- Total & Buttons -->
  <text x="420" y="275" text-anchor="end" fill="#10B981" font-family="Cairo, sans-serif" font-size="14" font-weight="bold">الإجمالي النهائي: 36,700 ر.ي</text>
  <rect x="330" y="288" width="102" height="30" rx="6" fill="url(#gold1)"/>
  <text x="381" y="308" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">إصدار الفاتورة</text>
  <rect x="220" y="288" width="100" height="30" rx="6" fill="#231911" stroke="#C9A86A" stroke-width="1"/>
  <text x="270" y="308" text-anchor="middle" fill="#F9F6F0" font-family="Cairo, sans-serif" font-size="12">دفع نقدي</text>
  <!-- Thermal Receipt Printer -->
  <rect x="515" y="245" width="155" height="135" rx="12" fill="#1B2028" stroke="#C9A86A" stroke-width="2"/>
  <rect x="535" y="175" width="115" height="95" rx="4" fill="#FFFFFF"/>
  <text x="592" y="198" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="13" font-weight="bold">فاتورة Matjar Pro</text>
  <line x1="548" y1="208" x2="636" y2="208" stroke="#231911" stroke-dasharray="3,3"/>
  <text x="592" y="226" text-anchor="middle" fill="#231911" font-family="Cairo, sans-serif" font-size="11">مأرب - المدينة</text>
  <text x="592" y="246" text-anchor="middle" fill="#059669" font-family="monospace" font-size="12" font-weight="bold">36,700 YER</text>
</svg>
